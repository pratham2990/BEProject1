<!DOCTYPE html>
<html>

<head>

    <title>Robot Control</title>

    <style>

        body {
            text-align: center;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        button {
            width: 120px;
            height: 50px;
            margin: 5px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #45a049;
        }

        input[type=range] {
            width: 300px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 15px auto;
            width: 420px;
            border-radius: 12px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body onmouseup="stop()" ontouchend="stop()">

<h2>🤖 Robot Control Panel</h2>

<div class="card">

    <h3>🎥 Live Camera</h3>

    <img src="/video" width="400">

</div>

<div class="card">

    <h3>🧠 Detection</h3>

    <p><b>Object:</b> <span id="det_label">None</span></p>

    <p><b>Confidence:</b> <span id="det_conf">0</span></p>

    <p><b>Position:</b> <span id="det_pos">None</span></p>

</div>

<div class="card">

    <h3>🚗 Robot Movement</h3>

    <button
        onmousedown="setControl(200,1,200,1)"
        onmouseup="stop()"
        ontouchstart="setControl(200,1,200,1)"
        ontouchend="stop()">

        Forward

    </button>

    <br>

    <button
        onmousedown="setControl(100,0,100,1)"
        onmouseup="stop()"
        ontouchstart="setControl(100,0,100,1)"
        ontouchend="stop()">

        Left

    </button>

    <button
        onmousedown="setControl(100,1,100,0)"
        onmouseup="stop()"
        ontouchstart="setControl(100,1,100,0)"
        ontouchend="stop()">

        Right

    </button>

    <br>

    <button
        onmousedown="setControl(200,0,200,0)"
        onmouseup="stop()"
        ontouchstart="setControl(200,0,200,0)"
        ontouchend="stop()">

        Backward

    </button>

</div>

<div class="card">

    <h3>🦾 Robotic Arm Control</h3>

    Servo 1:<br>
    <input type="range" min="0" max="180"
           value="90"
           onchange="moveServo(1, this.value)">

    <br><br>

    Servo 2:<br>
    <input type="range" min="0" max="180"
           value="90"
           onchange="moveServo(2, this.value)">

    <br><br>

    Servo 3:<br>
    <input type="range" min="0" max="180"
           value="90"
           onchange="moveServo(3, this.value)">

    <br><br>

    Servo 4:<br>
    <input type="range" min="0" max="180"
           value="90"
           onchange="moveServo(4, this.value)">

    <br><br>

    Servo 5:<br>
    <input type="range" min="0" max="180"
           value="90"
           onchange="moveServo(5, this.value)">

</div>

<script>

// ---------------- MOVEMENT ----------------
function setControl(ls, ld, rs, rd) {

    fetch('/control', {

        method: 'POST',

        headers: {
            'Content-Type':
            'application/x-www-form-urlencoded'
        },

        body:
        `ls=${ls}&ld=${ld}&rs=${rs}&rd=${rd}`
    });
}

function stop() {

    setControl(0,0,0,0);
}

// ---------------- SERVO ----------------
function moveServo(id, angle) {

    fetch('/servo', {

        method: 'POST',

        headers: {
            'Content-Type':
            'application/x-www-form-urlencoded'
        },

        body: `id=${id}&angle=${angle}`
    });
}

// ---------------- DETECTION DISPLAY ----------------
setInterval(() => {

    fetch('/get_detection')

        .then(res => res.json())

        .then(data => {

            document.getElementById(
                "det_label"
            ).innerText =
                data.label || "None";

            document.getElementById(
                "det_conf"
            ).innerText =
                data.confidence ?
                Number(data.confidence).toFixed(2)
                : "0";

            document.getElementById(
                "det_pos"
            ).innerText =
                data.position || "None";
        });

}, 500);

</script>

</body>
</html>
