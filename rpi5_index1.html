<!DOCTYPE html>
<html>

<head>

    <title>Pi5 Robot Dashboard</title>

    <style>

        body {
            background-color: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .card {

            margin: 20px auto;
            padding: 20px;
            width: 700px;

            background: #222;

            border-radius: 10px;
        }

        img {

            border: 3px solid white;
            border-radius: 10px;
        }

        button {

            width: 120px;
            height: 50px;

            margin: 5px;

            font-size: 16px;

            border: none;
            border-radius: 8px;

            background-color: #4CAF50;
            color: white;
        }

        button:hover {

            background-color: #45a049;
        }

    </style>

</head>

<body onmouseup="stop()" ontouchend="stop()">

<h1>🤖 Pi5 Robot Dashboard</h1>

<!-- CAMERA -->
<div class="card">

    <h2>🎥 Live Detection Stream</h2>

    <img src="/video_feed" width="640">

</div>

<!-- DETECTION -->
<div class="card">

    <h2>🧠 Detection Info</h2>

    <p>
        Object:
        <span id="label">None</span>
    </p>

    <p>
        Confidence:
        <span id="conf">0</span>
    </p>

</div>

<!-- MOVEMENT -->
<div class="card">

    <h2>🚗 Robot Movement</h2>

    <button
        onmousedown="setControl(200,1,200,1)"
        onmouseup="stop()"
        ontouchstart="setControl(200,1,200,1)"
        ontouchend="stop()">

        Forward

    </button>

    <br><br>

    <button
        onmousedown="setControl(100,0,100,1)"
        onmouseup="stop()"
        ontouchstart="setControl(100,0,100,1)"
        ontouchend="stop()">

        Left

    </button>

    <button
        onmousedown="setControl(100,1,100,0)"
        onmouseup="stop()"
        ontouchstart="setControl(100,1,100,0)"
        ontouchend="stop()">

        Right

    </button>

    <br><br>

    <button
        onmousedown="setControl(200,0,200,0)"
        onmouseup="stop()"
        ontouchstart="setControl(200,0,200,0)"
        ontouchend="stop()">

        Backward

    </button>

</div>

<script>

// ---------------- MOVEMENT ----------------
function setControl(ls, ld, rs, rd) {

    fetch('/control', {

        method: 'POST',

        headers: {
            'Content-Type':
            'application/x-www-form-urlencoded'
        },

        body:
        `ls=${ls}&ld=${ld}&rs=${rs}&rd=${rd}`
    });
}

function stop() {

    setControl(0,0,0,0);
}

// ---------------- DETECTION DISPLAY ----------------
setInterval(() => {

    fetch('/get_detection')

    .then(response => response.json())

    .then(data => {

        document.getElementById(
            "label"
        ).innerText = data.label;

        document.getElementById(
            "conf"
        ).innerText = data.confidence;
    });

}, 300);

</script>

</body>
</html>
